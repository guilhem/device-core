name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: '1.98.1'
          components: rustfmt,clippy
      - run: sudo apt-get update && sudo apt-get install -y dbus libglib2.0-bin openssh-client rauc openssl squashfs-tools
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python3 tools/dbus-contract.py --check
