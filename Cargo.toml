[package]
name = "device-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Linux device services over D-Bus and optional HTTP"
repository = "https://github.com/guilhem/device-core"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "process", "sync", "signal", "io-util", "net", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
libc = "0.2"
fastrand = "2"
axum = "0.8"
async-stream = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
semver = "1"
tokio-tungstenite = "0.28"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dist]
inherits = "release"
